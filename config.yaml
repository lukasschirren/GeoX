# Wildcards:
scenario:
  country: ['NA']
  weather_year: [2023]
  # Can be 'hydrogen' or 'ammonia'
  plant_type: 'ammonia'

# Weather data:
# Change to a number that would be added to the 'weather_year' above and used as
# the end weather year date
years_to_check: 1

# Frequency of data:
freq: '1H'

# Generators:
# Modify 'generators_dict' to hold the generators you would like to use
# Make sure it is in the same style as below
generators_dict: {'solar' : [], 'wind' : [], 'hydro' : [], 'biomass' : [], 'geothermal' : []}
panel: 'CSi'
turbine: 'NREL_ReferenceTurbine_2020ATB_4MW'
# Generator capacities:
# For solar, wind, hydro: multiplied by spatial potential data per hexagon
# For biomass, geothermal: constant capacity per hexagon (backup/flexibility)
gen_capacity:
    solar: 1       # MW per unit of solar potential from spatial data
    wind: 4        # MW per turbine (based on turbine specifications)
    hydro: 1       # MW per unit of hydro potential from spatial data
    biomass: 100   # MW constant capacity per hexagon for backup/flexibility
    geothermal: 50 # MW constant capacity per hexagon for baseload

# Other:
solver : 'gurobi'
water_limit: False

transport:
    pipeline_construction: True
    road_construction: True

# Make sure this matches the currency used in most of your parameter files
currency: 'euros'